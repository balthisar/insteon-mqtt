######################################################################
# These modems scenes work quickly compared to Home Assistant
# feeding them one by one. Scenes can be on and off. You can turn
# off a light or switch when a scene comes on with on_level: 0.
#
# You must restart this container after modifying this file, because
# the changes won't be recognized otherwise!
#
# Changes: 
#   insteon-mqtt config.yaml sync-all --run
#
# Battery Devices:
# Manually wake them by holding in the set button on the device until
# the device light flashes or you hear a beep. At this point they will
# stay awake for approximately 3 minutes.
#
# If you manually wake up a device using this method, then call this
# command so that the Insteon-MQTT knows that it can send messages
# to the device for the next three minutes:
#    insteon-mqtt config.yaml awake aa.bb.cc
#
# These are the devices we usually need to force awake:
#    insteon-mqtt config.yaml awake 3b.3d.ca    # Laundry Door Sensor
#    insteon-mqtt config.yaml awake 54.ee.4b    # Guest Room Remote
#    insteon-mqtt config.yaml awake 54.ef.7f    # Master Bedroom Remote
######################################################################


  - name: Basement Back Rooms
    controllers:
      - modem: 29
    responders:
      - basement storage light switch
      - basement server room light switch

  - name: Exterior Lights All
    controllers:
      - modem: 30
    responders:
      - deck exterior light switch
      - deck exterior spot light switch
      - front exterior light switch
      - laundry exterior light switch:
          on_level: 65.1

  - name: Exterior Lights Holiday
    controllers:
      - modem: 31
    responders:
      - deck exterior light switch
      - deck exterior spot light switch
      - front exterior light switch:
          on_level: 0
      - laundry exterior light switch:
          on_level: 65.1

  - name: First Floor from Mudroom
    controllers:
      - modem: 32
    responders:
      - foyer light switch
      - foyer light switch (secondary)
      - hallway light switch
      - hallway light switch (secondary)
      - kitchen light switch
      - kitchen table light switch

  - name: First Floor from Foyer
    controllers:
      - modem: 33
    responders:
      - hallway light switch
      - hallway light switch (secondary)
      - kitchen light switch
      - kitchen table light switch

  - name: Good Morning Commute
    controllers:
      - modem: 34
    responders:
      - hallway light switch:
          on_level: 40.0
      - hallway light switch (secondary):
          on_level: 40.0
      - kitchen light switch:
          on_level: 40.0
      - kitchen table light switch:
          on_level: 40.0
      - laundry light switch
      - laundry light switch (secondary)
      - stairway light switch:
          on_level: 30.0
      - stairway light switch (secondary, middle):
          on_level: 30.0
      - stairway light switch (secondary, start):
          on_level: 30.0
      - foyer light switch:
          on_level: 40.0
      - foyer light switch (secondary):
          on_level: 40.0

  - name: Good Morning Staying at Home
    controllers:
      - modem: 35
    responders:
      - hallway light switch:
          on_level: 40.0
      - hallway light switch (secondary):
          on_level: 40.0
      - kitchen light switch:
          on_level: 40.0
      - kitchen table light switch:
          on_level: 40.0
      - stairway light switch:
          on_level: 30.0
      - stairway light switch (secondary, middle):
          on_level: 30.0
      - stairway light switch (secondary, start):
          on_level: 30.0
      - foyer light switch:
          on_level: 40.0
      - foyer light switch (secondary):
          on_level: 40.0
      - office light switch

  - name: Good Night from Bedroom
    controllers:
      - modem: 36
    responders:
      - basement server room light switch
      - basement sewing light switch
      - basement stairs light switch
      - basement stairs light switch (secondary): 1
      - basement storage light switch
      - dining room light switch
      - foyer light switch
      - foyer light switch (secondary)
      - garage light switch
      - hallway light switch
      - hallway light switch (secondary)
      - hallway toilet light switch
      - kitchen light switch
      - kitchen sink light switch
      - kitchen table light switch
      - laundry light switch
      - laundry light switch (secondary)
      - linen closet light switch
      - living room lights switch
      - living room lights switch (secondary)
      - office light switch
      - parlour lights switch
      - stairway light switch
      - stairway light switch (secondary, middle)
      - stairway light switch (secondary, start)

  - name: Interior Lights All
    controllers:
      - modem: 37
    responders:
      - audrey bedroom light switch
      - jamie bedroom light switch
      - basement server room light switch
      - basement sewing light switch
      - basement stairs light switch
      - basement stairs light switch (secondary): 1
      - basement storage light switch
      - dining room light switch
      - foyer light switch
      - foyer light switch (secondary)
      - garage light switch
      - hallway light switch
      - hallway light switch (secondary)
      - hallway toilet light switch
      - kitchen light switch
      - kitchen sink light switch
      - kitchen table light switch
      - laundry light switch
      - laundry light switch (secondary)
      - linen closet light switch
      - living room lights switch
      - living room lights switch (secondary)
      - master bedroom lights switch
      - master bedroom closet light switch
      - office light switch
      - parlour lights switch
      - stairway light switch
      - stairway light switch (secondary, middle)
      - stairway light switch (secondary, start)

  - name: Kitchen Lights All
    controllers:
      - modem: 20
    responders:
      - kitchen light switch
      - kitchen sink light switch
      - kitchen table light switch

  - name: Kitchen and Sink Lights
    controllers:
      - modem: 22
    responders:
      - kitchen light switch
      - kitchen sink light switch

  - name: Parlour and Dining Lights
    controllers:
      - modem: 23
    responders:
      - dining room light switch
      - parlour lights switch

  - name: Upstairs Rooms
    controllers:
      - modem: 38
    responders:
      - audrey bedroom light switch
      - jamie bedroom light switch
      - master bedroom lights switch


######################################################################
# These device to device networks keep n-way switches synchronized.
######################################################################

  - controllers:
      - laundry light switch
      - laundry light switch (secondary)
    responders:
      - laundry light switch (secondary)
      - laundry light switch
  - controllers:
      - living room lights switch
      - living room lights switch (secondary)
    responders:
      - living room lights switch (secondary)
      - living room lights switch
  - controllers:
      - hallway light switch (secondary)
      - hallway light switch
    responders:
      - hallway light switch
      - hallway light switch (secondary)
  - controllers:
      - basement stairs light switch
      - basement stairs light switch (secondary): 1
    responders:
      - basement stairs light switch (secondary): 1
      - basement stairs light switch
  - controllers:
      - foyer light switch
      - foyer light switch (secondary)
    responders:
      - foyer light switch
      - foyer light switch (secondary)
  - controllers:
      - stairway light switch (secondary, start)
      - stairway light switch (secondary, middle)
      - stairway light switch
    responders:
      - stairway light switch
      - stairway light switch (secondary, middle)
      - stairway light switch (secondary, start)


######################################################################
# This is the keypad_linc at the top of the basements stairs. These
# are Insteon links only, so some of the buttons have to be handled
# in software.
######################################################################

  - controllers:
      - basement stairs light switch (secondary): 3
      - basement sewing light switch
    responders:
      - basement sewing light switch
      - basement stairs light switch (secondary): 3

  - controllers:
      - basement stairs light switch (secondary): 4
      - basement lounge light switch
    responders:
      - basement lounge light switch
      - basement stairs light switch (secondary): 4

  - controllers:
      - basement stairs light switch (secondary): 5
      - basement storage light switch
    responders:
      - basement storage light switch
      - basement stairs light switch (secondary): 5

  - controllers:
      - basement stairs light switch (secondary): 6
      - basement server room light switch
    responders:
      - basement server room light switch
      - basement stairs light switch (secondary): 6

  
######################################################################
# The Guest Room Remote switch controls an Insteon mini dimmer.
######################################################################

  - controllers:
      - guest room switch: 1
    responders:
      - guest bedroom light


