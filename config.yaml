#==========================================================================
#
# Insteon <-> MQTT bridge configuration file.
#   This overrides settings in source data/config-base.yaml.
#
# Insteon-MQTT "reasons":
#   'device' if a button was pressed on the device, or if `/scene` was used
#      instead of `/set` via MQTT. Note that there's a bug in that switches
#      when software activated don't use `device` as the reason, but I've
#      fixed this with the template, below. TODO: was this fixed in code?
#   'scene' if the device is responding to a scene trigger from an insteon
#      scene. E.g., the secondary switches all report "scene" as their
#      reason after updating themselves from the Insteon links.
#   'refresh' if the update is from a refresh.
#      Probably get events if a refresh is performed.
#  'command' if the device is responding to an on/off command (rather than
#      scene command). I'm not sending on/off commands, but using scenes,
#      so I could use this just for switch ON/OFF. And, this is exactly
#      how it's being sent when I MQTT it! So I can ignore these in
#      automations.
#  <string> if passed in via the scene or on/off style command inputs.
#
# Strategy:
#  - Primary control of the home is via software.
#  - Physical switches should be considered remote controls ONLY, and tell
#    HASS what to do, except in cases where we have Insteon scenes or where
#    they actually control a load.
#  - We need to maintain state between SWITCH and SOFTWARE.
#  - Must be able to change SWITCH state without controlling the load.
#  - Must be able to avoid infinite loops.
#
# Notes:
#  - I can turn DIMMERS on/off with /SET, /LEVEL, or /SCENE.
#    - /LEVEL does NOT invoke Insteon links.
#    - /LEVEL and /SCENE do not sync brightness via Insteon links.
#  - I can turn SWITCHES on/off with /SET, or with /SCENE
#  - I can turn KEYPAD LINC button on/off with /SET/{{button}}. If it's
#    button 1, I can specify a LEVEL. Also can /SCENE/{{button}}.
#
# Adding new devices:
#    insteon-mqtt join
#    insteon-mqtt pair
#
# Removing devices:
#    insteon-mqtt config.yaml db-delete -o modem ctrl 51.d3.05 1
#    insteon-mqtt config.yaml db-delete -o modem resp 51.d3.05 1
#
# NOTE: original Insteon PLM address is 3d.98.c5
#==========================================================================


#==========================================================================
#
# Logging configuration.
#
#==========================================================================
logging:
  # 5=VERBOSE, 10=DEBUG, 20=INFO, 30=WARNING, 40=ERROR
  # VERBOSE only adds logging of MQTT ping requests to DEBUG
  level: 20

  # Print messages to a file.
  file: /config/insteon_mqtt.log


#==========================================================================
#
# Insteon configuration
#
#==========================================================================
insteon:
  port: '/dev/insteon'           # modem tty port
  address: 70.1a.89              # PLM modem Insteon hex address
  storage: '/config/data'        # Device database file storage location.
  startup_refresh: False         # Auto refresh devices at startup?
  scenes: '/config/scenes.yaml'  # Path to Scenes Definition file (Optional)


  #------------------------------------------------------------------------
  # Devices require the Insteon hex address and an optional name. Note
  # that MQTT address topics are always the lower case hex address or
  # the input name depending on how they are configured below.
  #------------------------------------------------------------------------
  devices:

    #
    # On/off switch devices (outlets, wall switches, appliance modules, etc).
    #
    switch:
      - 43.f3.45: 'Basement Server Room Light Switch'
      - 51.02.6b: 'Basement Sewing Light Switch'
      - 17.44.f3: 'Basement Lounge Light Switch'
      - 17.44.f2: 'Basement Gym Light Switch'
      - 43.ec.93: 'Basement Storage Light Switch'
      - 43.ec.f7: 'Garage Exterior Outlet Switch'
      - 42.53.70: 'Laundry Light Switch'                      # PRIMARY, near the sink.
      - 42.50.19: 'Laundry Light Switch (secondary)'          # SECONDARY, near the garage.
      - 43.f3.c7: 'Living Room Lights Switch'
      - 43.f4.70: 'Living Room Lights Switch (secondary)'
      - 41.dc.49: 'Master Bedroom Lights Switch'
      - 42.50.17: 'Parlour Lights Switch'


    #
    # Dimming devices (outlets, wall switches, lamp modules, etc).
    #
    dimmer:
    
      # THESE DEVICES use the {{scene_topic}} instead of {{level_topic}} as cmd_t.

      - 43.30.f0: 'Audrey Bedroom Light Switch'
      - 56.98.2a: 'Deck Exterior Light Switch'
      - 42.d4.5d: 'Deck Exterior Spot Light Switch'
      - 42.e4.d1: 'Dining Room Light Switch'
      - 43.2b.82: 'Front Exterior Light Switch'               # Porch and garage light fixtures.
      - 42.d4.57: 'Garage Light Switch'                       # Garage interior.
      - 70.ae.9a: 'Guest Bedroom Light'                       # Dimmer Micro Module
      - 43.08.d3: 'Hallway Toilet Light Switch'
      - 43.08.64: 'Jamie Bedroom Light Switch'
      - 42.cb.55: 'Kitchen Light Switch'
      - 43.45.19: 'Kitchen Sink Light Switch'
      - 42.e5.01: 'Kitchen Table Light Switch'
      - 42.d6.7b: 'Linen Closet Light Switch'
      - 42.e1.53: 'Master Bedroom Closet Light Switch'
      - 42.d6.b2: 'Office Light Switch'

      # THESE DEVICES need to revert to {level_topic}} for the cmd_t.
    
      - 43.10.60: 'Basement Stairs Light Switch'              # PRIMARY, at bottom of stairs.
        discovery_override_class: "revert_to_level_topic"

      - 43.33.c8: 'Foyer Light Switch'                        # SECONDARY, in hallway
        discovery_override_class: "revert_to_level_topic"

      - 43.27.46: 'Foyer Light Switch (secondary)'            # SECONDARY, near front door.
        discovery_override_class: "revert_to_level_topic"

      - 43.1b.48: 'Hallway Light Switch'                      # PRIMARY, near the staircase.
        discovery_override_class: "revert_to_level_topic"

      - 43.06.f0: 'Hallway Light Switch (secondary)'          # SECONDARY, in the hallway.
        discovery_override_class: "revert_to_level_topic"

      - 43.30.df: 'Stairway Light Switch'                     # PRIMARY, at top of stairs.
        discovery_override_class: "revert_to_level_topic"

      - 43.30.6b: 'Stairway Light Switch (secondary, middle)' # SECONDARY, middle run, next to master bedroom.
        discovery_override_class: "revert_to_level_topic"

      - 43.39.c6: 'Stairway Light Switch (secondary, start)'  # SECONDARY, starting switch, bottom of stairs.
        discovery_override_class: "revert_to_level_topic"


    #
    # Battery powered mini remotes.
    #
    
    # Remotes with 1 button, used as on/off.
    mini_remote1:
      - 70.86.79: 'Guest Room Switch'
        discovery_override_class: "mini_remote1_1_button"
    
    # Remotes with 8 buttons, used as 4 x ON/OFF. These maintain state, it seems.
    mini_remote8:
      - 54.ee.4b: 'Guest Room Remote'
        discovery_override_class: "mini_remote8_4_buttons"
      - 54.ef.7f: 'Master Bedroom Remote'
        discovery_override_class: "mini_remote8_4_buttons"


    #
    # KeypadLinc dimmers (dimmer+scene controller).
    #
    keypad_linc:

      # THESE DEVICES use {{dimmer_level_topic}}, which we're changing in the template,
      # below, so that it's LEVEL instead of SET. However, we also need to not publish
      # the entities that don't apply.

      - 56.d3.ca: 'Basement Stairs Light Switch (secondary)'  # SECONDARY, at top of stairs.
        discovery_override_class: "kpl_6_buttons"


      - 70.9a.d5: 'Laundry Exterior Light Switch'             
        discovery_override_class: "kpl_6_buttons"

#==========================================================================
#
# MQTT configuration
#
#==========================================================================
mqtt:
  broker: 127.0.0.1
  port: 1883
  keep_alive: 30
  qos: 1
  retain: 1
  encryption:
  enable_discovery: true
  availability_topic: 'insteon/availability'


  #------------------------------------------------------------------------
  # Discovery override classes
  #------------------------------------------------------------------------

  #
  #  We've changed the command_topic to scene_topic instead of the default
  #  level_topic, but some of the dimmers need to remain as scene_topic.
  #
  revert_to_level_topic:
    discovery_overrides:
      dimmer:
        config:
          cmd_t: "{{level_topic}}"

  #
  # Don't publish buttons that don't exist on our six button keypads.
  #
  kpl_6_buttons:
    discovery_overrides:
      button2:
        discoverable: false
      button7:
        discoverable: false
      button8:
        discoverable: false
      button9:
        discoverable: false

  #
  # Our mini remotes are used as one buttons remotes, ON and OFF.
  # This hide buttons 2 through 8 by default.
  #
  mini_remote1_1_button:
    discovery_overrides:
      button2:
        discoverable: false
      button3:
        discoverable: false
      button4:
        discoverable: false
      button5:
        discoverable: false
      button6:
        discoverable: false
      button7:
        discoverable: false
      button8:
        discoverable: false

  #
  # Our mini remotes are used as four buttons remotes, ON and OFF.
  # This hide buttons 4 through 8 by default.
  #
  mini_remote8_4_buttons:
    discovery_overrides:
      button5:
        discoverable: false
      button6:
        discoverable: false
      button7:
        discoverable: false
      button8:
        discoverable: false
  

  #------------------------------------------------------------------------
  switch:
  #------------------------------------------------------------------------

    # Broadcast the state whenever a state change is detected, even if the
    # state change is the result of us telling the device to change state.
    #
    # Here we extend the default so that we can put ALL of the data in the
    # payload. In particular, we want the `fast` field, but having other
    # data could be interesting, too.
    state_topic: 'insteon/{{address}}/state'
    state_payload: >
      { "state"      : "{{on_str.upper()}}",
        "mode"       : "{{mode.upper()}}",
        "timestamp"  :  {{timestamp}},
        "reason"     : "{{reason}}",
        "address"    : "{{address}}",
        "name"       : "{{name}}",
        "on_off"     :  {{on}},
        "fast"       :  {{fast}},
        "instant"    :  {{instant}}
      }

    # Manual mode (holding down a button) is triggered once when the button
    # is held and once when it's released.  Available variables for
    # templating are address (see above), name (see above), and:
    #   manual_str = 'up'/'off'/'down'
    #   manual = 1/0/-1
    #   manual_openhab = 2/1/0
    #
    # Here we extend the default so that we can put ALL of the data in the
    # payload. In addition, the default has this disabled.
    manual_state_topic: 'insteon/{{address}}/manual_state'
    manual_state_payload:  >
      { "manual_str" : "{{manual_str.upper()}}",
        "manual"     :  {{manual}},
        "address"    : "{{address}}",
        "name"       : "{{name}}"
      }

    # Input on/off command.  Similar functionality to the cmd_topic but only
    # for turning the device on and off. If reason is input, it will be
    # passed through to the state_payload.  The output of passing the payload
    # through the template must match the following:
    #   { "cmd" : 'on'/'off', ["mode" : 'normal'/'fast'/'instant'],
    #             ["fast" : 1/0], ["instant" : 1/0], ["reason" : "..."] }
    # Available variables for templating are:
    #   value = the input payload
    #   json = the input payload converted to json.  Use json.VAR to extract
    #          a variable from a json payload.
    on_off_topic: 'insteon/{{address}}/set'
    on_off_payload: >
      { "cmd" : {%- if json is defined and json -%}
                  "{{json.state.lower()}}"
                {%- else -%}
                  "{{value.lower()}}"
                {%- endif -%}}

    # Scene on/off command.  This triggers the scene broadcast on the switch
    # in the same way clicking the button would. The inputs are the same as
    # those for the on_off topic and payload.
    scene_topic: 'insteon/{{address}}/scene'
    scene_payload: >
      {
        "cmd"    : {% if json.cmd is defined -%}
                      "{{json.cmd.lower()}}"
                   {% else -%}
                      "{{value}}"
                   {%- endif -%}
        {% if json.brightness is defined %}
            , "level" : {{json.brightness}}
        {% endif %}
      }

    # The default is normally {{level_topic}}, but we want to use this instead,
    # because we want to simulate physically using the switch. We'll *undo* this
    # on a case by case basis for sync'd dimmers, because we have to sync their
    # LED brightness manually.
    discovery_entities:
      switch:
        config:
          icon: "mdi:lightbulb-variant"
          cmd_t: "{{scene_topic}}"


  #------------------------------------------------------------------------
  dimmer:
  #------------------------------------------------------------------------

    # Dimmer switch.  Dimming lamp modules and wall switches.

    # Output state change topic and payload.  This message is sent
    # whenever the device state changes for any reason.
    #
    # Here we extend the default so that we can put ALL of the data in the
    # payload. In particular, we want the `fast` field, but having other
    # data could be interesting, too.
    state_topic: 'insteon/{{address}}/state'
    state_payload: >-
      { "state"      : "{{on_str.upper()}}",
        "brightness" :  {{level_255}},
        "mode"       : "{{mode}}",
        "timestamp"  :  {{timestamp}},
        "address"    : "{{address}}",
        "name"       : "{{name}}",
        "on_off"     :  {{on}},
        "fast"       :  {{fast}},
        "instant"    :  {{instant}},
        "reason"     : "{{reason}}"
      }

    # Manual mode (holding down a button) is triggered once when the button
    # is held and once when it's released.  Available variables for
    # templating are address (see above), name (see above), and:
    #   manual_str = 'up'/'off'/'down'
    #   manual = 1/0/-1
    #   manual_openhab = 2/1/0
    #
    # Here we extend the default so that we can put ALL of the data in the
    # payload. In addition, the default has this disabled.
    manual_state_topic: 'insteon/{{address}}/manual_state'
    manual_state_payload: >
      { "manual_str" : "{{manual_str.upper()}}",
        "manual"     :  {{manual}},
        "address"    : "{{address}}",
        "name"       : "{{name}}"
      }

    # Input on/off command.  Similar functionality to the cmd_topic but only
    # for turning the device on and off.  If reason is input, is will be
    # passed through to the state_payload.  The output of passing the payload
    # through the template must match the following:
    #   { "cmd" : "on"/"off", ["mode" : 'normal'/'fast'/'instant'],
    #             ["fast" : 1/0], ["instant" : 1/0], ["reason" : "..."] }
    # Available variables for templating are:
    #   address = 'aa.bb.cc'
    #   timestamp = the current timestamp
    #   name = 'device name'
    #   value = the input payload
    #   json = the input payload converted to json.  Use json.VAR to extract
    #          a variable from a json payload.
    # NOTE: this isn't used by the default HA setup - it's only useful when
    # treating the dimmer as an on/off switch and sending ON/OFF payloads
    #
    # This is completely stock, but present to fill out this section completely.
    on_off_topic: 'insteon/{{address}}/set'
    on_off_payload: '{ "cmd" : "{{value.lower()}}" }'

    # Input dimming on/off command.  Similar functionality to the cmd_topic
    # but only for turning the device on and off and setting the level.  If
    # reason is input, is will be passed through to the state_payload.  The
    # output of passing the payload through the template must match the
    # following:
    #   { "cmd" : "on"/"off", ["level" : LEVEL],
    #                         ["mode" : 'normal'/'fast'/'instant'],
    #                         ["fast" : 1/0], ["instant" : 1/0],
    #                         ["reason" : "..."] }
    # where:
    #   LEVEL = 0->255 dimmer level
    # Available variables for templating are:
    #   address = 'aa.bb.cc'
    #   timestamp = the current timestamp
    #   name = 'device name'
    #   value = the input payload
    #   json = the input payload converted to json.  Use json.VAR to extract
    #          a variable from a json payload.
    #
    # NOTE: HASS JSON switch doesn't send brightness in some cases
    # when actuated so handle that here in the template code. This application
    # will use device's configured default on-level if brightness is not
    # specified. To use full-brightness instead, add the following to
    # the json.brightness check below:
    #    {% else %}
    #        , "level" : 255
    #
    # Here we've extended the payload to force "device" if no reason is
    # specified.
    level_topic: 'insteon/{{address}}/level'
    level_payload: >-
      { "cmd" : "{{json.state.lower()}}"
        {% if json.brightness is defined %}
            , "level" : {{json.brightness}}
        {% endif %}
        {% if json.reason is defined %}
            , "reason" : "{{json.reason}}"
        {% else %}
            , "reason" : "device"
        {% endif %}
      }

    # Scene on/off command.  This triggers the scene broadcast on the switch
    # in the same way clicking the button would.  The inputs are the same as
    # those for the on_off topic and payload.
    #
    # This is completely stock, but present to fill out this section completely.
    scene_topic: 'insteon/{{address}}/scene'
    scene_payload: '{ "cmd" : "{{json.state.lower()}}"
                      {% if json.brightness is defined %}
                          , "level" : {{json.brightness}}
                      {% endif %}
                    }'

    # The default is normally {{level_topic}}, but we want to use this instead,
    # because we want to simulate physically using the switch.
    discovery_entities:
      dimmer:
        config:
          cmd_t: "{{scene_topic}}"
      

  #------------------------------------------------------------------------
  remote:
  #------------------------------------------------------------------------

    # Battery powered remotes (usually 4 or 8 buttons).  A message is
    # sent whenever one of the buttons is pressed.
    #
    # The Remote will use the low_battery configuration
    # inputs from battery_sensor.

    # Output state change topic and template.  This message is sent
    # whenever a button is pressed.  Available variables for templating are:
    #   address = 'aa.bb.cc'
    #   timestamp = the current timestamp
    #   name = 'device name'
    #   button = 1...n  (button number 1-8 depending on configuration)
    #   on = 0/1
    #   on_str = 'off'/'on'
    #   mode = 'normal'/'fast'/'instant'
    #   fast = 0/1
    #   instant = 0/1
    state_topic: 'insteon/{{address}}/state/{{button}}'
    state_payload: >
      { "state"      : "{{on_str.upper()}}",
        "address"    : "{{address}}",
        "timestamp"  :  {{timestamp}},
        "name"       : "{{name}}",
        "button"     : "{{button}}",
        "on_off"     :  {{on}},
        "mode"       : "{{mode}}",
        "fast"       :  {{fast}},
        "instant"    :  {{instant}}
      }

    # Manual mode (holding down a button) is triggered once when the button
    # is held and once when it's released.  Available variables for
    # templating are address (see above), name (see above), button (see
    # above), and:
    #   manual_str = 'up'/'off'/'down'
    #   manual = 1/0/-1
    #   manual_openhab = 2/1/0
    #manual_state_topic: 'insteon/{{address}}/manual_state'
    #manual_state_payload: '{{manual_str.upper()}}'


  #------------------------------------------------------------------------
  keypad_linc:
  #------------------------------------------------------------------------

    # On/off switch state change topic and template.  This message is sent
    # whenever one of the on/off buttons is pressed.  It will not be sent for
    # button 1 if it's a dimmer.  Available variables for templating are:
    #   address = 'aa.bb.cc'
    #   timestamp = the current timestamp
    #   name = 'device name'
    #   button = 1-8
    #   on = 0/1
    #   on_str = 'off'/'on'
    #   mode = 'normal'/'fast'/'instant'
    #   fast = 0/1
    #   instant = 0/1
    #   reason = 'device'/'scene'/'command'/'refresh'/'...'
    btn_state_topic: 'insteon/{{address}}/state/{{button}}'
    btn_state_payload: >-
      { "state"      : "{{on_str.upper()}}",
        "address"    : "{{address}}",
        "timestamp"  :  {{timestamp}},
        "name"       : "{{name}}",
        "button"     : "{{button}}",
        "on_off"     :  {{on}},
        "mode"       : "{{mode}}",
        "fast"       :  {{fast}},
        "instant"    :  {{instant}},
        "reason"     : "{{reason}}"
      }

    # Dimmer output state change topic and payload for button 1.  This
    # message is sent whenever the device dimmer state changes for any
    # reason.  Available variables for templating are:
    #   address = 'aa.bb.cc'
    #   timestamp = the current timestamp
    #   name = 'device name'
    #   on = 0/1
    #   on_str = 'off'/'on'
    #   level_255 = 0-255
    #   level_100 = 0-100
    #   mode = 'normal'/'fast'/'instant'/'ramp'
    #   fast = 0/1
    #   instant = 0/1
    #   reason = 'device'/'scene'/'command'/'refresh'/'...'
    dimmer_state_topic: 'insteon/{{address}}/state/1'
    dimmer_state_payload: >-
      { "state"      : "{{on_str.upper()}}",
        "brightness" :  {{level_255}},
        "address"    : "{{address}}",
        "name"       : "{{name}}",
        "on_off"     :  {{on}},
        "mode"       : "{{mode}}",
        "timestamp"  :  {{timestamp}},
        "fast"       :  {{fast}},
        "instant"    :  {{instant}},
        "reason"     : "{{reason}}"
      }

    # Manual mode (holding down a button) is triggered once when the button
    # is held and once when it's released.  Available variables for
    # templating are address (see above), name (see above), and:
    #   manual_str = 'up'/'off'/'down'
    #   manual = 1/0/-1
    #   manual_openhab = 2/1/0
    #manual_state_topic: 'insteon/{{address}}/manual_state'
    #manual_state_payload: '{{manual_str.upper()}}'

    # Input on/off command.  For button 1, this will set the load.  For other
    # buttons, it just set the button LED.  If reason is input, is will be
    # passed through to the state_payload.  The output of passing the payload
    # through the template must match the following:
    #   { "cmd" : 'on'/'off', "button": button,
    #             ["mode" : 'normal'/'fast'/'instant'/'ramp'],
    #             ["fast" : 1/0], ["instant" : 1/0], ["reason" : "..."],
    #             ["transition" : time_in_seconds] }
    # Available variables for templating are:
    #   value = the input payload
    #   json = the input payload converted to json.  Use json.VAR to extract
    #          a variable from a json payload.
    btn_on_off_topic: 'insteon/{{address}}/set/{{button}}'
    btn_on_off_payload: >-
      { "cmd" : {%- if json is defined and json -%}
                  "{{json.state.lower()}}"
                {%- else -%}
                  "{{value.lower()}}"
                {%- endif -%}}

    # Input dimming on/off command for button 1.  Similar functionality to
    # the cmd_topic but only for turning the group 1 on and off and setting
    # the level.  This topic can be the same as the btn_on_off_topic in which
    # case either command format is valid.   If reason is input, is will be
    # passed through to the state_payload.  The output of passing the
    # payload through the template must match the following:
    #   { "cmd" : "on"/"off", ["level" : LEVEL],
    #             ["mode" : 'normal'/'fast'/'instant'/'ramp'],
    #             ["fast" : 1/0], ["instant" : 1/0], ["reason" : "..."],
    #             ["transition" : time_in_seconds] }
    # where:
    #   LEVEL = 0->255 dimmer level
    # Available variables for templating are:
    #   address = 'aa.bb.cc'
    #   timestamp = the current timestamp
    #   name = 'device name'
    #   value = the input payload
    #   json = the input payload converted to json.  Use json.VAR to extract
    #          a variable from a json payload.
    # We are changing SET in the dimmer_level_topic to LEVEL.
    dimmer_level_topic: 'insteon/{{address}}/level/1'
    dimmer_level_payload: >
       { "cmd" : "{{json.state.lower()}}"
         {% if json.brightness is defined %}
             , "level" : {{json.brightness}}
         {% endif %}
         {% if json.transition is defined %}
             , "transition" : {{json.transition}}
         {% endif %} 
         {% if json.reason is defined %}
             , "reason" : "{{json.reason}}"
         {% else %} 
             , "reason" : "device"
         {% endif %} 
        }

    # Scene on/off command.  This triggers the scene broadcast on the switch
    # in the same way clicking the button would.  The inputs are the same as
    # those for the btn_on_off topic and payload.
    btn_scene_topic: 'insteon/{{address}}/scene/{{button}}'
    btn_scene_payload: '{ "cmd" : "{{json.state.lower()}}"
                          {% if json.brightness is defined %}
                              , "level" : {{json.brightness}}
                          {% endif %}
                        }'
